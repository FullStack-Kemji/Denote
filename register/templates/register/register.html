{% extends 'notes/base.html' %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Register {% endblock %}</title>
</head>
<body>
    {% block content %}
   

        <form method="post" class="p-4 bg-light rounded shadow-sm">
            {% csrf_token %}
            {{form|crispy}}
            <button type="submit" class="btn custom-btn">Register</button>
        </form>
    {% endblock %}
</body>
</html>
