{% extends 'notes/base.html' %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Login {% endblock %}</title>
</head>
<body>
    {% block content %}
        <style>
            
            .custom-butt{
                background-color: #89CFF0;
                color: white;
            }

            .custom-butt:hover{
                background-color: #5DADE2;
                color: black;
            }

            .custom-btn{
                background-color: #6c757d;
                color: white;
            }

            .custom-btn:hover{
             background-color: #5a6268   ;
             color: black;
            }

        </style>

        <form method="post" class="p-4 bg-light rounded shadow-sm" action="{% url 'login' %}">

            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn custom-butt">Login</button>
            
            <br>
            <a href="/register">Dont Have An Account?</a>

        </form>

        <form style="display: inline;" method="post" class="p-4 bg-light rounded shadow-sm" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn custom-btn">Log out</button>
        </form>

    {% endblock %}
</body>
</html>
